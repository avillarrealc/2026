<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Docente Multigrado 2026 | I.E. José Antonio Galán</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-dark: #0f172a;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-purple: #8b5cf6;
      --card-border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 1.5rem 1rem 3rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    /* HEADER */
    .header-bar {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(12px);
      padding: 1.4rem 1.8rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .header-title h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .cloud-pill {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    .cloud-pill.saving {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }

    /* GRADE TABS */
    .grade-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 1.2rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      flex: 1;
      padding: 0.85rem 1.2rem;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active.tab-g9 {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
    }

    .tab-btn.active.tab-g10 {
      background: linear-gradient(135deg, #059669, #047857);
      color: white;
      box-shadow: 0 4px 15px rgba(5, 150, 105, 0.35);
    }

    .tab-btn.active.tab-g11 {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
    }

    /* SESSION SELECTOR BAR */
    .session-bar {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem 1.4rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .session-picker-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .session-picker-box label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .session-select {
      background: #0f172a;
      color: white;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      max-width: 420px;
    }

    .btn-new-session {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }
    .btn-new-session:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-2px);
    }

    /* STATS CARDS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-status {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 4px;
    }
    .status-ok { color: #10b981; }
    .status-wait { color: #f59e0b; }

    .stat-date {
      font-size: 0.82rem;
      color: #94a3b8;
      font-family: monospace;
    }

    /* TABLE CARD */
    .sheet-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      overflow: hidden;
      color: #1e293b;
      margin-bottom: 2rem;
    }

    .sheet-header-box {
      background: #1e3a8a;
      color: white;
      padding: 1.2rem 1.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .sheet-header-box h3 {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-tipo {
      font-size: 0.76rem;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .pill-regular { background: #3b82f6; color: white; }
    .pill-practica { background: #10b981; color: white; }

    .table-container {
      overflow-x: auto;
      padding: 1.2rem;
    }

    table.control-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      font-family: Arial, sans-serif;
    }

    table.control-table th {
      background-color: #1e3a8a;
      color: white;
      padding: 12px 10px;
      text-align: left;
      font-weight: 700;
      border: 1px solid #94a3b8;
      font-size: 0.88rem;
    }

    table.control-table td {
      padding: 10px 10px;
      border: 1px solid #cbd5e1;
      vertical-align: middle;
    }

    table.control-table tr:nth-child(even) {
      background-color: #f8fafc;
    }

    table.control-table tr:hover {
      background-color: #f1f5f9;
    }

    .custom-check {
      appearance: none;
      width: 26px;
      height: 26px;
      border: 2px solid #94a3b8;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      vertical-align: middle;
    }

    .custom-check:checked {
      background-color: #10b981;
      border-color: #059669;
    }

    .custom-check:checked::after {
      content: '✓';
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .cell-input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.85rem;
      font-family: inherit;
      color: #1e293b;
    }
    .cell-input:focus {
      outline: 2px solid #3b82f6;
      border-color: transparent;
    }

    .select-status {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-weight: 600;
      font-size: 0.82rem;
      background: white;
      cursor: pointer;
    }

    .btn-csv {
      background: #10b981;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-csv:hover { background: #059669; }

    /* MODAL NUEVA SESIÓN */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: #1e293b;
      color: white;
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .form-input, .form-select {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 12px;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }
    .form-input:focus, .form-select:focus {
      border-color: #3b82f6;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 1.5rem;
    }

    .btn-cancel {
      background: #475569;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-confirm {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    #loadingOverlay {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem;
      font-size: 1.1rem;
      color: #64748b;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <header class="header-bar">
      <div class="header-title">
        <h1>📊 Panel Docente IEJAGA 2026</h1>
        <p>Control de Clases y Prácticas · Grados 9°, 10° y 11° · La Estrella</p>
      </div>
      <div class="cloud-pill" id="cloudStatus">
        <span>☁️</span> <span id="cloudStatusText">Conectado a Google Drive</span>
      </div>
    </header>

    <!-- GRADE TABS (SELECTOR) -->
    <nav class="grade-tabs">
      <button class="tab-btn active tab-g9" id="tabG9" onclick="switchGrade('g9')">
        <span>🐍</span> Grado 9° (3 Grupos)
      </button>
      <button class="tab-btn tab-g10" id="tabG10" onclick="switchGrade('g10')">
        <span>⚡</span> Grado 10° (3 Grupos)
      </button>
      <button class="tab-btn tab-g11" id="tabG11" onclick="switchGrade('g11')">
        <span>🎬</span> Grado 11° (2 Grupos)
      </button>
    </nav>

    <!-- SESSION SELECTOR BAR -->
    <section class="session-bar">
      <div class="session-picker-box">
        <label for="sessionSelect">Sesión a Controlar:</label>
        <select class="session-select" id="sessionSelect" onchange="switchSession(this.value)">
          <!-- Populated dynamically -->
        </select>
      </div>
      <button class="btn-new-session" onclick="openNewSessionModal()">
        <span>➕</span> Nueva Clase o Práctica
      </button>
    </section>

    <!-- STATS CARDS POR GRUPO -->
    <section class="stats-grid" id="statsGrid">
      <!-- Rendered dynamically -->
    </section>

    <!-- TABLE CARD -->
    <main class="sheet-card">
      <div class="sheet-header-box">
        <h3 id="tableTitle">
          <span id="headerSessionName">Clase 9</span>
          <span class="pill-tipo pill-regular" id="headerPillTipo">Regular</span>
        </h3>
        <button class="btn-csv" onclick="downloadCurrentCSV()">
          <span>📥</span> Descargar CSV del Grado
        </button>
      </div>

      <div class="table-container">
        <div id="loadingOverlay">
          <span>⏳</span> Conectando con Google Drive...
        </div>
        <table class="control-table" id="gradeTable" style="display: none;">
          <thead>
            <tr>
              <th style="width: 10%; text-align: center;">Grupo</th>
              <th style="width: 18%;">Horario Habitual</th>
              <th style="width: 14%;">Fecha de Clase</th>
              <th style="width: 12%; text-align: center;">¿Impartida?</th>
              <th style="width: 14%;">Classroom</th>
              <th style="width: 10%; text-align: center;">Entregas</th>
              <th style="width: 22%;">Observaciones / Novedad</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Rendered from cloud -->
          </tbody>
        </table>
      </div>
    </main>

  </div>

  <!-- MODAL NUEVA CLASE O SESIÓN DE PRÁCTICA -->
  <div class="modal-overlay" id="newSessionModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>➕</span> Agregar Nueva Sesión
      </div>

      <div class="form-group">
        <label>Tipo de Sesión:</label>
        <select class="form-select" id="newSessionTipo">
          <option value="regular">📘 Clase Teórico-Práctica Regular</option>
          <option value="practica">🛠️ Clase de Práctica / Laboratorio en Sala</option>
          <option value="evaluacion">🎯 Reto ABR / Evaluación Formativa</option>
          <option value="refuerzo">🔄 Taller de Refuerzo / Nivelación</option>
        </select>
      </div>

      <div class="form-group">
        <label>Título o Tema de la Clase/Práctica:</label>
        <input type="text" class="form-input" id="newSessionTitulo" placeholder="Ej: Práctica 2: Reto de Algoritmos en Colab">
      </div>

      <div class="form-group">
        <label>Fecha Base Programada (DD-MM-AAAA):</label>
        <input type="text" class="form-input" id="newSessionFecha" placeholder="Ej: 15-09-2026">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeNewSessionModal()">Cancelar</button>
        <button class="btn-confirm" onclick="confirmNewSession()">Crear y Guardar en Drive</button>
      </div>
    </div>
  </div>

  <script>
    let activeGrade = 'g9';
    let currentSessionIndex = 0;
    let allGradesData = null;

    function initDashboard() {
      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(onDataLoaded)
          .withFailureHandler(onDataError)
          .loadAllGradesData();
      } else {
        // Fallback local
        allGradesData = {
          g9: {
            nombre: "Grado 9°",
            materia: "Fundamentos de Programación (Python)",
            gruposBase: ["9°1", "9°2", "9°3"],
            horariosBase: {
              "9°1": "Martes (1° y 2° hora)",
              "9°2": "Miércoles (3° y 4° hora)",
              "9°3": "Jueves (5° y 6° hora)"
            },
            sesiones: [
              {
                id: "g9-c8",
                tipo: "regular",
                numero: 8,
                titulo: "Clase 8: Introducción a Colecciones de Datos",
                fechaBase: "01-09-2026",
                grupos: [
                  { grupo: "9°1", horario: "Martes (1° y 2° hora)", fecha: "01-09-2026", impartida: true, classroom: "Calificada", entregas: "34/34", obs: "Completada" },
                  { grupo: "9°2", horario: "Miércoles (3° y 4° hora)", fecha: "02-09-2026", impartida: true, classroom: "Calificada", entregas: "33/33", obs: "Completada" },
                  { grupo: "9°3", horario: "Jueves (5° y 6° hora)", fecha: "03-09-2026", impartida: true, classroom: "Calificada", entregas: "35/35", obs: "Completada" }
                ]
              },
              {
                id: "g9-c9",
                tipo: "regular",
                numero: 9,
                titulo: "Clase 9: Listas en Python: Indexación y Corchetes",
                fechaBase: "08-09-2026",
                grupos: [
                  { grupo: "9°1", horario: "Martes (1° y 2° hora)", fecha: "08-09-2026", impartida: false, classroom: "Borrador", entregas: "0/34", obs: "Lista para impartir" },
                  { grupo: "9°2", horario: "Miércoles (3° y 4° hora)", fecha: "09-09-2026", impartida: false, classroom: "Borrador", entregas: "0/33", obs: "Lista para impartir" },
                  { grupo: "9°3", horario: "Jueves (5° y 6° hora)", fecha: "10-09-2026", impartida: false, classroom: "Borrador", entregas: "0/35", obs: "Lista para impartir" }
                ]
              },
              {
                id: "g9-p1",
                tipo: "practica",
                numero: "P1",
                titulo: "Práctica en Sala 1: Retos de Listas en Google Colab",
                fechaBase: "11-09-2026",
                grupos: [
                  { grupo: "9°1", horario: "Martes (1° y 2° hora)", fecha: "15-09-2026", impartida: false, classroom: "Borrador", entregas: "0/34", obs: "Ejercicios de refuerzo" },
                  { grupo: "9°2", horario: "Miércoles (3° y 4° hora)", fecha: "16-09-2026", impartida: false, classroom: "Borrador", entregas: "0/33", obs: "Ejercicios de refuerzo" },
                  { grupo: "9°3", horario: "Jueves (5° y 6° hora)", fecha: "17-09-2026", impartida: false, classroom: "Borrador", entregas: "0/35", obs: "Ejercicios de refuerzo" }
                ]
              }
            ]
          },
          g10: {
            nombre: "Grado 10°",
            materia: "El Proyecto Arduino y Circuitos en Tinkercad",
            gruposBase: ["10°1", "10°2", "10°3"],
            horariosBase: {
              "10°1": "Lunes (3° y 4° hora)",
              "10°2": "Miércoles (1° y 2° hora)",
              "10°3": "Viernes (3° y 4° hora)"
            },
            sesiones: [
              {
                id: "g10-c9",
                tipo: "regular",
                numero: 9,
                titulo: "Clase 9: Entradas Digitales con Pulsadores en Arduino",
                fechaBase: "08-09-2026",
                grupos: [
                  { grupo: "10°1", horario: "Lunes (3° y 4° hora)", fecha: "07-09-2026", impartida: false, classroom: "Borrador", entregas: "0/32", obs: "Programada" },
                  { grupo: "10°2", horario: "Miércoles (1° y 2° hora)", fecha: "09-09-2026", impartida: false, classroom: "Borrador", entregas: "0/31", obs: "Programada" },
                  { grupo: "10°3", horario: "Viernes (3° y 4° hora)", fecha: "11-09-2026", impartida: false, classroom: "Borrador", entregas: "0/30", obs: "Programada" }
                ]
              }
            ]
          },
          g11: {
            nombre: "Grado 11°",
            materia: "Producción Audiovisual y Página de Ventas",
            gruposBase: ["11°1", "11°2"],
            horariosBase: {
              "11°1": "Lunes (1° y 2° hora)",
              "11°2": "Jueves (3° y 4° hora)"
            },
            sesiones: [
              {
                id: "g11-c11",
                tipo: "regular",
                numero: 11,
                titulo: "Clase 11: Guion Técnico y Storyboard para Video Comercial",
                fechaBase: "07-09-2026",
                grupos: [
                  { grupo: "11°1", horario: "Lunes (1° y 2° hora)", fecha: "07-09-2026", impartida: false, classroom: "Borrador", entregas: "0/28", obs: "Programada" },
                  { grupo: "11°2", horario: "Jueves (3° y 4° hora)", fecha: "10-09-2026", impartida: false, classroom: "Borrador", entregas: "0/29", obs: "Programada" }
                ]
              }
            ]
          }
        };
        onDataLoaded(allGradesData);
      }
    }

    function onDataLoaded(data) {
      allGradesData = data;
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('gradeTable').style.display = 'table';
      populateSessionPicker();
      renderCurrentSession();
      setCloudStatus('☁️ Sincronizado con Drive');
    }

    function onDataError(err) {
      setCloudStatus('⚠️ Error de conexión');
      alert('Error cargando datos de Drive: ' + err.message);
    }

    function switchGrade(gradeKey) {
      activeGrade = gradeKey;
      currentSessionIndex = 0;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (gradeKey === 'g9') document.getElementById('tabG9').classList.add('active');
      if (gradeKey === 'g10') document.getElementById('tabG10').classList.add('active');
      if (gradeKey === 'g11') document.getElementById('tabG11').classList.add('active');

      populateSessionPicker();
      renderCurrentSession();
    }

    function populateSessionPicker() {
      const select = document.getElementById('sessionSelect');
      select.innerHTML = '';

      const gradeObj = allGradesData[activeGrade];
      if (!gradeObj || !gradeObj.sesiones) return;

      gradeObj.sesiones.forEach((ses, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        const icon = ses.tipo === 'practica' ? '🛠️' : '📘';
        opt.textContent = `${icon} ${ses.titulo}`;
        select.appendChild(opt);
      });

      // Default to last or current active class
      if (currentSessionIndex >= gradeObj.sesiones.length) {
        currentSessionIndex = gradeObj.sesiones.length - 1;
      }
      select.value = currentSessionIndex;
    }

    function switchSession(index) {
      currentSessionIndex = parseInt(index);
      renderCurrentSession();
    }

    function renderCurrentSession() {
      const gradeObj = allGradesData[activeGrade];
      if (!gradeObj || !gradeObj.sesiones || !gradeObj.sesiones[currentSessionIndex]) return;

      const ses = gradeObj.sesiones[currentSessionIndex];

      // Header labels
      document.getElementById('headerSessionName').textContent = ses.titulo;
      const pill = document.getElementById('headerPillTipo');
      if (ses.tipo === 'practica') {
        pill.textContent = 'Práctica en Sala';
        pill.className = 'pill-tipo pill-practica';
      } else {
        pill.textContent = 'Clase Regular';
        pill.className = 'pill-tipo pill-regular';
      }

      // Stats
      renderStats(ses);

      // Table rows
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      ses.grupos.forEach((row, index) => {
        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td style="text-align: center; font-weight: 800; font-size: 1.1rem; color: #1e3a8a;">${row.grupo}</td>
          <td>
            <input type="text" class="cell-input" value="${row.horario || ''}" placeholder="Ej: Martes (1° y 2°)" onchange="updateRowField(${index}, 'horario', this.value)">
          </td>
          <td>
            <input type="text" class="cell-input" value="${row.fecha}" onchange="updateRowField(${index}, 'fecha', this.value)">
          </td>
          <td style="text-align: center;">
            <input type="checkbox" class="custom-check" ${row.impartida ? 'checked' : ''} onchange="toggleRowImpartida(${index})">
          </td>
          <td>
            <select class="select-status" onchange="updateRowField(${index}, 'classroom', this.value)">
              <option value="Borrador" ${row.classroom === 'Borrador' ? 'selected' : ''}>⏳ Borrador</option>
              <option value="Programada" ${row.classroom === 'Programada' ? 'selected' : ''}>📅 Programada</option>
              <option value="Publicada" ${row.classroom === 'Publicada' ? 'selected' : ''}>📢 Publicada</option>
              <option value="Calificada" ${row.classroom === 'Calificada' ? 'selected' : ''}>✅ Calificada</option>
            </select>
          </td>
          <td>
            <input type="text" class="cell-input" style="text-align: center;" value="${row.entregas}" onchange="updateRowField(${index}, 'entregas', this.value)">
          </td>
          <td>
            <input type="text" class="cell-input" value="${row.obs}" placeholder="Novedades de la sesión..." onchange="updateRowField(${index}, 'obs', this.value)">
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    function renderStats(ses) {
      const statsGrid = document.getElementById('statsGrid');
      statsGrid.innerHTML = '';

      let doneCount = 0;
      ses.grupos.forEach(g => { if (g.impartida) doneCount++; });
      const percent = Math.round((doneCount / ses.grupos.length) * 100);

      // Summary Card
      const summaryCard = document.createElement('div');
      summaryCard.className = 'stat-card';
      summaryCard.style.borderTop = '4px solid var(--accent-blue)';
      summaryCard.innerHTML = `
        <div class="stat-header">
          <span>Avance Sesión</span>
          <span>📈</span>
        </div>
        <div class="stat-status">${doneCount} / ${ses.grupos.length} Grupos</div>
        <div class="stat-date">${percent}% Impartida</div>
      `;
      statsGrid.appendChild(summaryCard);

      // Per Group Cards
      ses.grupos.forEach(g => {
        const card = document.createElement('div');
        card.className = 'stat-card';
        card.style.borderTop = g.impartida ? '4px solid var(--accent-emerald)' : '4px solid var(--accent-amber)';

        card.innerHTML = `
          <div class="stat-header">
            <span>${g.grupo}</span>
            <span>${g.impartida ? '✅' : '⏳'}</span>
          </div>
          <div class="stat-status ${g.impartida ? 'status-ok' : 'status-wait'}">
            ${g.impartida ? 'Impartida' : 'Pendiente'}
          </div>
          <div class="stat-date">${g.fecha} · ${g.classroom}</div>
        `;
        statsGrid.appendChild(card);
      });
    }

    function toggleRowImpartida(index) {
      const ses = allGradesData[activeGrade].sesiones[currentSessionIndex];
      const g = ses.grupos[index];
      g.impartida = !g.impartida;
      if (g.impartida && g.classroom === 'Borrador') {
        g.classroom = 'Publicada';
      }
      renderCurrentSession();
      syncActiveGrade();
    }

    function updateRowField(index, field, value) {
      const ses = allGradesData[activeGrade].sesiones[currentSessionIndex];
      ses.grupos[index][field] = value;
      // Si se edita el horario, actualizar también el horario base del grupo para futuras sesiones
      if (field === 'horario') {
        const grp = ses.grupos[index].grupo;
        if (!allGradesData[activeGrade].horariosBase) allGradesData[activeGrade].horariosBase = {};
        allGradesData[activeGrade].horariosBase[grp] = value;
      }
      syncActiveGrade();
    }

    function syncActiveGrade() {
      setCloudStatus('⏳ Guardando en Drive...', true);

      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler((res) => {
            setCloudStatus(`☁️ Guardado en Drive (${res.hora})`);
          })
          .withFailureHandler((err) => {
            setCloudStatus('⚠️ Error al guardar');
          })
          .saveAllGradeData(activeGrade, allGradesData[activeGrade]);
      } else {
        setTimeout(() => {
          setCloudStatus('☁️ Guardado local (Simulación)');
        }, 500);
      }
    }

    function setCloudStatus(msg, isSaving = false) {
      const pill = document.getElementById('cloudStatus');
      const text = document.getElementById('cloudStatusText');
      text.textContent = msg;
      if (isSaving) pill.classList.add('saving');
      else pill.classList.remove('saving');
    }

    // MODAL LOGIC
    function openNewSessionModal() {
      const gradeObj = allGradesData[activeGrade];
      document.getElementById('newSessionTitulo').value = '';
      document.getElementById('newSessionFecha').value = new Date().toLocaleDateString('es-CO');
      document.getElementById('newSessionModal').classList.add('active');
    }

    function closeNewSessionModal() {
      document.getElementById('newSessionModal').classList.remove('active');
    }

    function confirmNewSession() {
      const tipo = document.getElementById('newSessionTipo').value;
      const titulo = document.getElementById('newSessionTitulo').value.trim();
      const fechaBase = document.getElementById('newSessionFecha').value.trim() || 'Fecha pendiente';

      if (!titulo) {
        alert('Por favor escribe el título o tema de la clase o práctica.');
        return;
      }

      const gradeObj = allGradesData[activeGrade];

      // Auto generate group entries based on grade groups
      const newGrupos = gradeObj.gruposBase.map(grpName => {
        return {
          grupo: grpName,
          horario: gradeObj.horariosBase[grpName] || "Horario habitual",
          fecha: fechaBase,
          impartida: false,
          classroom: "Borrador",
          entregas: "0/30",
          obs: "Programada"
        };
      });

      const newSesion = {
        id: `${activeGrade}-${Date.now()}`,
        tipo: tipo,
        titulo: titulo,
        fechaBase: fechaBase,
        grupos: newGrupos
      };

      gradeObj.sesiones.push(newSesion);
      currentSessionIndex = gradeObj.sesiones.length - 1;

      closeNewSessionModal();
      populateSessionPicker();
      renderCurrentSession();
      syncActiveGrade();
    }

    // EXPORT TO CSV
    function downloadCurrentCSV() {
      const gradeObj = allGradesData[activeGrade];
      let csv = "Tipo Sesión,Clase / Práctica,Fecha Base,Grupo,Horario,Fecha Impartida,¿Impartida?,Classroom,Entregas,Observaciones\n";
      
      gradeObj.sesiones.forEach(s => {
        const tipoTag = s.tipo === 'practica' ? '[PRÁCTICA]' : '[REGULAR]';
        const tituloClean = `"${s.titulo.replace(/"/g, '""')}"`;
        s.grupos.forEach(g => {
          const cleanObs = `"${(g.obs || '').replace(/"/g, '""')}"`;
          csv += `${tipoTag},${tituloClean},${s.fechaBase},${g.grupo},"${g.horario}",${g.fecha},${g.impartida ? 'TRUE' : 'FALSE'},${g.classroom},${g.entregas},${cleanObs}\n`;
        });
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', `Control_${activeGrade.toUpperCase()}_2026.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.onload = initDashboard;
  </script>
</body>
</html>
